<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CET-4 自动混编背单词系统</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 24px;
        }

        /* 单词卡片样式 */
        .word-card {
            text-align: center;
            margin: 30px 0;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .word-text {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        .word-phonetic {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
            background: #eee;
            padding: 2px 10px;
            border-radius: 20px;
        }

        .word-translation {
            font-size: 20px;
            color: #2c3e50;
            font-weight: 500;
            padding: 0 10px;
            line-height: 1.4;
        }

        .hidden {
            visibility: hidden;
        }

        /* 控制面板样式 */
        .control-panel {
            background: #f9fbff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e1e8ed;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            align-items: center;
            font-size: 15px;
            cursor: pointer;
        }

        .control-item input, .control-item select {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .control-item select {
            width: auto;
            height: auto;
            padding: 2px 5px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* 按钮样式 */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background-color: #cbd5e1;
        }

        .progress-info {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 多词库云端全自动背单词</h1>

    <div class="word-card">
        <div id="wordText" class="word-text">云端词库加载中...</div>
        <div id="wordPhonetic" class="word-phonetic">[/.../]</div>
        <div id="wordTranslation" class="word-translation">正在同步云端多词库数据，请稍候</div>
    </div>

    <div class="control-panel">
        <div class="control-group">
            <label class="control-item">
                <input type="checkbox" id="showPhonetic" checked> 显示音标
            </label>
            <label class="control-item">
                <input type="checkbox" id="showTranslation" checked> 显示中文译文
            </label>
            <label class="control-item">
                <input type="checkbox" id="speakWord" checked> 朗读英文单词
            </label>
            <label class="control-item">
                <input type="checkbox" id="speakTranslation" checked> 朗读中文译文
            </label>
            
            <label class="control-item">
                <span style="margin-right: 5px;">播放模式：</span>
                <select id="playMode">
                    <option value="sequence">顺序播放</option>
                    <option value="random" selected>随机播放</option>
                </select>
            </label>

            <label class="control-item">
                <span style="margin-right: 5px;">单词重复：</span>
                <select id="repeatCount">
                    <option value="1" selected>1 次</option>
                    <option value="2">2 次</option>
                    <option value="3">3 次</option>
                </select>
            </label>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" id="prevBtn" disabled>上一个</button>
            <button class="btn btn-primary" id="nextBtn" disabled>下一个</button>
        </div>
        
        <div id="progress" class="progress-info">初始化中...</div>
    </div>
</div>

<script>
    let rawVocabulary = []; 
    let vocabulary = [];    
    let currentIndex = 0;
    const synth = window.speechSynthesis;

    // DOM 引用
    const wordText = document.getElementById('wordText');
    const wordPhonetic = document.getElementById('wordPhonetic');
    const wordTranslation = document.getElementById('wordTranslation');
    const progressText = document.getElementById('progress');
    
    const showPhoneticCheck = document.getElementById('showPhonetic');
    const showTranslationCheck = document.getElementById('showTranslation');
    const speakWordCheck = document.getElementById('speakWord');
    const speakTranslationCheck = document.getElementById('speakTranslation');
    const playModeSelect = document.getElementById('playMode');
    const repeatCountSelect = document.getElementById('repeatCount');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // 核心改动：页面加载时自动抓取同目录下的自动化合并文件 all_words.json
    async function autoLoadCloudVocabulary() {
        try {
            // 读取由 GitHub Action 自动生成的合并总词库
            const response = await fetch('./all_words.json');
            if (!response.ok) throw new Error('未找到合并词库文件，请等待 GitHub 自动化脚本执行完成。');
            
            const data = await response.json();
            
            // 适配格式
            rawVocabulary = data.map(item => ({
                word: item.word || '未知单词',
                phonetic: item.phonetic_symbol ? (item.phonetic_symbol.startsWith('[') ? item.phonetic_symbol : `[${item.phonetic_symbol}]`) : '[/ /]',
                translation: item.mean || '暂无释义'
            }));

            if (rawVocabulary.length === 0) {
                progressText.innerText = "词库内没有任何有效单词";
                return;
            }

            // 激活控制
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            initPlayQueue();

        } catch (err) {
            console.error(err);
            wordText.innerText = "加载失败";
            wordTranslation.innerText = err.message;
            progressText.innerText = "请检查仓库中是否包含 JSON 词库";
        }
    }

    function initPlayQueue() {
        if (rawVocabulary.length === 0) return;

        const mode = playModeSelect.value;
        if (mode === 'random') {
            vocabulary = [...rawVocabulary];
            for (let i = vocabulary.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocabulary[i], vocabulary[j]] = [vocabulary[j], vocabulary[i]];
            }
        } else {
            vocabulary = [...rawVocabulary];
        }

        currentIndex = 0;
        updateCard();
    }

    function updateCard() {
        if (vocabulary.length === 0) return;
        synth.cancel(); 

        const currentWord = vocabulary[currentIndex];
        
        wordText.innerText = currentWord.word;
        wordPhonetic.innerText = currentWord.phonetic;
        wordTranslation.innerText = currentWord.translation;

        wordPhonetic.classList.toggle('hidden', !showPhoneticCheck.checked);
        wordTranslation.classList.toggle('hidden', !showTranslationCheck.checked);

        const modeLabel = playModeSelect.value === 'random' ? '随机播放' : '顺序播放';
        progressText.innerText = `云端全库共 ${vocabulary.length} 个单词 | [${modeLabel}] 当前：第 ${currentIndex + 1} 个`;

        handleAudioFlow(currentWord);
    }

    function handleAudioFlow(currentWord) {
        const shouldSpeakWord = speakWordCheck.checked;
        const shouldSpeakTranslation = speakTranslationCheck.checked;

        if (!shouldSpeakWord && !shouldSpeakTranslation) return; 

        const maxRepeats = parseInt(repeatCountSelect.value, 10);
        let currentRepeat = 0;

        const wordUtterance = new SpeechSynthesisUtterance(currentWord.word);
        wordUtterance.lang = 'en-US';
        wordUtterance.rate = 0.9;

        const cleanTranslation = currentWord.translation.replace(/[a-z]+\.\s*/g, '').replace(/[，、；]/g, '，');
        const transUtterance = new SpeechSynthesisUtterance(cleanTranslation);
        transUtterance.lang = 'zh-CN';

        transUtterance.onend = () => {
            if (speakTranslationCheck.checked) {
                setTimeout(nextWord, 800); 
            }
        };

        wordUtterance.onend = () => {
            currentRepeat++;
            if (currentRepeat < maxRepeats) {
                synth.speak(wordUtterance);
            } else {
                if (shouldSpeakTranslation) {
                    synth.speak(transUtterance);
                }
            }
        };

        if (shouldSpeakWord) {
            synth.speak(wordUtterance);
        } else if (shouldSpeakTranslation) {
            synth.speak(transUtterance);
        }
    }

    function nextWord() {
        if (currentIndex < vocabulary.length - 1) {
            currentIndex++;
            updateCard();
        } else {
            alert('全库单词已全部完成一轮背诵！');
            initPlayQueue(); 
        }
    }

    function prevWord() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    nextBtn.addEventListener('click', nextWord);
    prevBtn.addEventListener('click', prevWord);

    showPhoneticCheck.addEventListener('change', () => wordPhonetic.classList.toggle('hidden', !showPhoneticCheck.checked));
    showTranslationCheck.addEventListener('change', () => wordTranslation.classList.toggle('hidden', !showTranslationCheck.checked));
    
    speakWordCheck.addEventListener('change', updateCard);
    speakTranslationCheck.addEventListener('change', updateCard);
    repeatCountSelect.addEventListener('change', updateCard);
    playModeSelect.addEventListener('change', initPlayQueue);

    // 页面开启时自动运行加载
    autoLoadCloudVocabulary();
</script>

</body>
</html>
